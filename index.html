<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="AI music portfolio" />
  <title>AI Music Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #04110b;
      color: #edfdf3;
      font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: rgba(237, 253, 243, 0.78);
      line-height: 1.7;
    }

    .loading strong {
      display: block;
      margin-bottom: 10px;
      color: #b9ff5b;
      font-size: 20px;
    }

    .loading a {
      color: #b9ff5b;
    }
  </style>
  <script>
    (async () => {
      try {
        const response = await fetch('/portfolio/index.html', { cache: 'no-store' });
        if (!response.ok) throw new Error('portfolio page not found');
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = `
          <div class="loading">
            <div>
              <strong>포트폴리오를 불러오는 중입니다.</strong>
              <div>잠시 뒤 새로고침하거나 <a href="/portfolio/index.html">portfolio/index.html</a>로 직접 열어보세요.</div>
            </div>
          </div>
        `;
      }
    })();
  </script>
</head>
<body>
  <div class="loading">
    <div>
      <strong>포트폴리오를 불러오는 중입니다.</strong>
      <div>잠시만 기다려 주세요.</div>
    </div>
  </div>
</body>
</html>
